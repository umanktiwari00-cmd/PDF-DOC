<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PDF to Excel | PDFDOC</title>

    <link rel="stylesheet" href="css/pdf-excel.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <h1 class="logo">
            PDFDOC
        </h1>

        <div class="nav-links">

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="index.html#tools" class="nav-link">
                Tools
            </a>

            <a href="index.html#about" class="nav-link">
                About
            </a>

        </div>

    </nav>


    <!-- PDF to Excel -->

    <main class="pdf-tool">

        <h2 class="pdf-tool-title">
            PDF to Excel
        </h2>

        <p class="pdf-tool-description">
            Convert tables from your PDF into an Excel spreadsheet.
        </p>


        <div class="upload-box">

            <input
                type="file"
                id="pdf-file"
                accept=".pdf"
            >

            <p id="file-name">
                No file selected
            </p>

        </div>


        <button id="convert-button">
            Convert to Excel
        </button>


        <div class="result-box">

            <p id="status"></p>

            <button id="download-button" hidden>
                Download Excel
            </button>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
