x<!DOCTYPE html>
<html lang="en">



<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PDFDOC</title>


    <!-- Favicon -->

    <link
        rel="icon"
        type="image/png"
        sizes="64x64"
        href="./pdfdoc-favicon.png?v=3"
    >

    <link
        rel="shortcut icon"
        type="image/png"
        href="./pdfdoc-favicon.png?v=3"
    >


    <!-- Page CSS -->

    <link
        rel="stylesheet"
        href="css/pdf-word.css"
    >

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <h1 class="logo">
            PDFDOC
        </h1>

        <div class="nav-links">

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="index.html#tools" class="nav-link">
                Tools
            </a>

            <a href="index.html#about" class="nav-link">
                About
            </a>

        </div>

    </nav>


    <!-- PDF to Word -->

    <main class="pdf-tool">

        <h2 class="pdf-tool-title">
            PDF to Word
        </h2>

        <p class="pdf-tool-description">
            Convert your PDF into an editable Word document.
        </p>


        <div class="upload-box">

            <input
                type="file"
                id="pdf-file"
                accept=".pdf"
            >

            <p id="file-name">
                No file selected
            </p>

        </div>


        <button id="convert-button">
            Convert to Word
        </button>


        <div class="result-box">

            <p id="status"></p>

            <button id="download-button" hidden>
                Download Word
            </button>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
