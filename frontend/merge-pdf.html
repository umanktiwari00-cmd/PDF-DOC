<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Merge PDF | PDFDOC</title>

    <link rel="stylesheet" href="css/merge-pdf.css">
</head>

<body>

    <nav class="navbar">

        <h1 class="logo">PDFDOC</h1>

        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="index.html#tools" class="nav-link">Tools</a>
            <a href="index.html#about" class="nav-link">About</a>
        </div>

    </nav>


    <main class="pdf-tool">

        <h2 class="pdf-tool-title">Merge PDF</h2>

        <p class="pdf-tool-description">
            Combine multiple PDF files into one PDF.
        </p>


        <div class="upload-box">

            <input
                type="file"
                id="pdf-files"
                accept=".pdf"
                multiple
            >

            <p id="file-name">No files selected</p>

        </div>


        <button id="merge-button">
            Merge PDFs
        </button>


        <div class="result-box">

            <p id="status"></p>

            <button id="download-button" hidden>
                Download PDF
            </button>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
