<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Split PDF | PDFDOC</title>

    <link rel="stylesheet" href="css/split-pdf.css">
</head>

<body>

    <nav class="navbar">

        <h1 class="logo">PDFDOC</h1>

        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="index.html#tools" class="nav-link">Tools</a>
            <a href="index.html#about" class="nav-link">About</a>
        </div>

    </nav>


    <main class="pdf-tool">

        <h2 class="pdf-tool-title">Split PDF</h2>

        <p class="pdf-tool-description">
            Extract specific pages from your PDF.
        </p>


        <div class="upload-box">

            <input type="file" id="pdf-file" accept=".pdf">

            <p id="file-name">No file selected</p>

        </div>


        <div class="page-range">

            <input
                type="number"
                id="start-page"
                placeholder="Start page"
                min="1"
            >

            <input
                type="number"
                id="end-page"
                placeholder="End page"
                min="1"
            >

        </div>


        <button id="split-button">
            Split PDF
        </button>


        <div class="result-box">

            <p id="status"></p>

            <button id="download-button" hidden>
                Download PDF
            </button>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
