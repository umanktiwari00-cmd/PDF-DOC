<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF to PowerPoint | PDFDOC</title>

    <link rel="stylesheet" href="css/pdf-ppt.css">
</head>

<body>

    <nav class="navbar">

        <h1 class="logo">PDFDOC</h1>

        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="index.html#tools" class="nav-link">Tools</a>
            <a href="index.html#about" class="nav-link">About</a>
        </div>

    </nav>


    <main class="pdf-tool">

        <h2 class="pdf-tool-title">PDF to PowerPoint</h2>

        <p class="pdf-tool-description">
            Convert your PDF files into PowerPoint presentations.
        </p>


        <div class="upload-box">

            <input type="file" id="pdf-file" accept=".pdf">

            <p id="file-name">No file selected</p>

        </div>


        <button id="convert-button">
            Convert to PowerPoint
        </button>


        <div class="result-box">

            <p id="status"></p>

            <button id="download-button" hidden>
                Download PowerPoint
            </button>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
